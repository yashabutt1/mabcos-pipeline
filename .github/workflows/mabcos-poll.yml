name: MABCOS approval poll

# Checks Telegram for your Approve/Reject taps and posts approved items — however
# long after the batch was sent. Runs every ~15 min (GitHub may delay a little).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Shared with the generate workflow so pending.json is never written by two runs at once.
concurrency:
  group: mabcos-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests python-dotenv google-genai

      - name: Write .env from secrets
        run: |
          umask 177
          cat > .env <<'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_TOKEN=${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Scan published posts for new comments → Telegram alert
        run: python comment_watch.py || true

      - name: Process approvals + comment replies (long-poll window)
        env:
          MABCOS_POLL_SECONDS: "1200"   # ~20 min so taps post within seconds of approving
        run: python approve_poll.py

      - name: Commit queue + comment state
        run: |
          git config user.name "mabcos-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending.json published.json comments.json
          git diff --staged --quiet || git commit -m "chore: update approval/comment state [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push || true
