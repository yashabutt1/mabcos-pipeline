name: MABCOS approval poll

# Posts your Telegram Approve taps to Facebook (+ Instagram) and sends comment-reply
# alerts. This is a LONG-RUNNING poller: each run long-polls Telegram continuously for
# ~5.5 hours so a tap is caught and posted within seconds — not a quick 3-min check that
# almost never overlapped a tap. The cron keeps a fresh run queued behind the active one,
# so coverage is effectively 24/7. Public repo => unlimited Actions minutes.
on:
  schedule:
    - cron: "*/15 * * * *"   # keeps a run queued behind the active one (GitHub may delay these)
  workflow_dispatch: {}

# Its OWN group (NOT the shared mabcos-state group used by generate): the poll never
# writes pending.json, so it can run continuously without blocking the generate workflow.
# One poll at a time.
concurrency:
  group: mabcos-poll
  cancel-in-progress: false

permissions:
  contents: write          # the poll commits published.json + comments.json (comment-watch state)

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # GitHub hard-caps a job at 6h; the poll exits ~20 min early so the commit step runs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests python-dotenv google-genai

      - name: Write .env from secrets
        run: |
          umask 177
          cat > .env <<'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_TOKEN=${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Process approvals + comment replies (continuous long-poll)
        env:
          # ~5.5h of continuous long-polling; each iteration confirms the prior taps with
          # Telegram, so handled approvals never repeat even though pending.json is never written.
          MABCOS_POLL_SECONDS: "19800"
          # Rescan published posts for new comments every 10 min during the long run, so
          # reply alerts stay responsive.
          MABCOS_SCAN_SECONDS: "600"
          # Refresh the queued items from the live repo each loop, so cards queued AFTER
          # this job started are still approvable.
          PENDING_URL: "https://raw.githubusercontent.com/yashabutt1/mabcos-pipeline/master/pending.json"
        run: python approve_poll.py

      - name: Commit comment-watch state
        if: always()          # persist published.json/comments.json even if the poll step errored
        run: |
          git config user.name "mabcos-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published.json comments.json
          git diff --staged --quiet || git commit -m "chore: update comment-watch state [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push || true
