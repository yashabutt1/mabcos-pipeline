name: MABCOS generate + queue

# Three times a day, at peak activity windows so alerts (and the posts you approve)
# land when people are online. GitHub cron is UTC and may be delayed 5–30 min.
# Times below are Pakistan time (UTC+5) — morning, lunch, evening. Adjust if your
# audience sits in another timezone (check Page Insights for when YOUR followers are on).
on:
  schedule:
    - cron: "0 3 * * *"     # 08:00 PKT — morning
    - cron: "0 8 * * *"     # 13:00 PKT — lunch
    - cron: "0 15 * * *"    # 20:00 PKT — evening
  workflow_dispatch:         # lets you run it manually from the Actions tab
    inputs:
      dry_run:
        description: "Generate only (NO Telegram queue); upload images/reels as an artifact"
        type: boolean
        default: false

# Shared with the poll workflow so pending.json is never written by two runs at once.
concurrency:
  group: mabcos-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg + emoji font)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          umask 177
          cat > .env <<'EOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_TOKEN=${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}
          AMAZON_ASSOC_TAG=${{ secrets.AMAZON_ASSOC_TAG }}
          AMAZON_MARKETPLACE=www.amazon.com
          EOF

      - name: Unique batch id (keeps morning/evening separate in the queue)
        run: echo "MABCOS_SLOT=$(date -u +%H%M)" >> "$GITHUB_ENV"

      - name: Generate batch
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: python pipeline.py

      - name: Queue to Telegram for approval
        if: github.event.inputs.dry_run != 'true'
        run: python cloud_queue.py

      - name: Commit pending queue + history
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "mabcos-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending.json history.json
          git diff --staged --quiet || git commit -m "chore: queue batch for approval [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push || true

      - name: Upload batch preview (dry run only)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mabcos-batch-preview
          path: |
            output/**/cards/*.png
            output/**/reels/*.mp4
          if-no-files-found: warn
          retention-days: 7
